<svg xmlns="http://www.w3.org/2000/svg"
     width="490" height="317" viewBox="0 0 490 317"
     role="img" aria-label="Info card for Abdellah Elberkaoui">
<style>
  @keyframes fadein {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .l0 { animation: fadein 0.45s ease 300ms both; }
  .l1 { animation: fadein 0.45s ease 420ms both; }
  .l2 { animation: fadein 0.45s ease 540ms both; }
  .l3 { animation: fadein 0.45s ease 660ms both; }
  .l4 { animation: fadein 0.45s ease 780ms both; }
  .l5 { animation: fadein 0.45s ease 900ms both; }
  .l6 { animation: fadein 0.45s ease 1020ms both; }
  .l7 { animation: fadein 0.45s ease 1140ms both; }
  .l8 { animation: fadein 0.45s ease 1260ms both; }
  .l9 { animation: fadein 0.45s ease 1380ms both; }
  .l10 { animation: fadein 0.45s ease 1500ms both; }
  .l0, .l1, .l2, .l3, .l4, .l5, .l6, .l7, .l8, .l9, .l10 {
    animation-fill-mode: both;
  }
</style>
  <!-- Background -->
  <rect width="490" height="317" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect width="490" height="30" rx="8" fill="#161b22"/>
  <rect y="22" width="490" height="8" fill="#161b22"/>
