  <rect x="100" y="322" class="l12" width="14" height="14" rx="3" fill="#a371f7"/>
  <rect x="120" y="322" class="l12" width="14" height="14" rx="3" fill="#e3b341"/>
  <rect x="140" y="322" class="l12" width="14" height="14" rx="3" fill="#7ee787"/>
